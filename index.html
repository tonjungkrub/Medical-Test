<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming and locks scaling for a native app feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pharma Heads Up</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s;
            text-align: center;
        }

        #start-screen, #game-screen, #end-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Show start screen by default */
        #start-screen { display: flex; }

        h1 { font-size: 3rem; margin-bottom: 10px; }
        .word-display { font-size: 6rem; font-weight: bold; margin: 20px 0; }
        .timer { font-size: 2rem; position: absolute; top: 20px; right: 30px; font-weight: bold; }
        .instructions { font-size: 1.5rem; margin-bottom: 40px; color: #bdc3c7; }
        
        button {
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 20px 40px;
            font-size: 2rem;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:active { transform: translateY(4px); box-shadow: none; }

        /* Fallback tap zones just in case gyro is locked */
        .tap-zones {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            opacity: 0.3;
        }
        .tap-zones div {
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>Pharma Charades</h1>
        <p class="instructions">Hold iPad to your forehead in Landscape.<br>Tilt DOWN = Correct (+1)<br>Tilt UP = Pass</p>
        <!-- This button acts as the required user gesture to request iOS sensor permissions -->
        <button onclick="requestSensorPermission()">START GAME</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="timer" id="time-left">60</div>
        <div class="word-display" id="current-word">Word</div>
        <div class="tap-zones">
            <div onclick="handleSkip()">Tap: Pass</div>
            <div onclick="handleCorrect()">Tap: Correct</div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen">
        <h1>Time's Up!</h1>
        <div class="word-display" id="final-score">Score: 0</div>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <script>
        // Your custom pharmacology word list
        const words = [
            "Chloramphenicol",
            "Methotrexate",
            "Hydroxyurea",
            "Febuxostat",
            "6-Mercaptopurine",
            "Probenecid"
        ];

        let shuffledWords = [];
        let currentWordIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        let isProcessingTilt = false; // Prevents rapid double-triggering

        // iOS 13+ requires explicit permission to access the gyroscope
        function requestSensorPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startGame();
                        } else {
                            alert("Gyroscope permission denied. You can use the tap buttons at the bottom to play.");
                            startGame();
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS 13+ devices
                window.addEventListener('deviceorientation', handleOrientation);
                startGame();
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.body.style.backgroundColor = '#3498db'; // Standard playing color

            score = 0;
            timeLeft = 60;
            document.getElementById('time-left').innerText = timeLeft;
            
            // Shuffle the word list
            shuffledWords = [...words].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            
            showNextWord();

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function showNextWord() {
            if (currentWordIndex >= shuffledWords.length) {
                // Reshuffle and loop if they run out of words
                shuffledWords = [...words].sort(() => Math.random() - 0.5);
                currentWordIndex = 0;
            }
            document.getElementById('current-word').innerText = shuffledWords[currentWordIndex];
        }

        function handleOrientation(event) {
            if (isProcessingTilt || timeLeft <= 0 || document.getElementById('game-screen').style.display === 'none') return;

            // beta represents the front-to-back tilt in degrees [-180, 180]
            // gamma represents left-to-right tilt. 
            // When holding an iPad in landscape against the forehead, beta is usually around 80-100 (upright).
            let tilt = event.beta; 

            // Tilt Down (Face towards floor) -> Correct
            if (tilt > 130 && tilt < 180) {
                handleCorrect();
            }
            // Tilt Up (Face towards ceiling) -> Pass
            else if (tilt < 45 && tilt > -90) {
                handleSkip();
            }
        }

        function handleCorrect() {
            if (isProcessingTilt) return;
            isProcessingTilt = true;
            score++;
            
            // Flash Green for Correct
            document.body.style.backgroundColor = '#2ecc71';
            document.getElementById('current-word').innerText = "CORRECT!";
            
            setTimeout(() => {
                currentWordIndex++;
                showNextWord();
                document.body.style.backgroundColor = '#3498db';
                isProcessingTilt = false;
            }, 1200);
        }

        function handleSkip() {
            if (isProcessingTilt) return;
            isProcessingTilt = true;
            
            // Flash Red for Pass
            document.body.style.backgroundColor = '#e74c3c';
            document.getElementById('current-word').innerText = "PASS";
            
            setTimeout(() => {
                currentWordIndex++;
                showNextWord();
                document.body.style.backgroundColor = '#3498db';
                isProcessingTilt = false;
            }, 1200);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex';
            document.body.style.backgroundColor = '#2c3e50';
            document.getElementById('final-score').innerText = `Score: ${score}`;
            window.removeEventListener('deviceorientation', handleOrientation);
        }

        function resetGame() {
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
