<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pharma Heads Up</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s;
            text-align: center;
        }

        #start-screen, #game-screen, #end-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-screen { display: flex; }

        h1 { font-size: 3rem; margin-bottom: 10px; }
        .word-display { font-size: 6rem; font-weight: bold; margin: 20px 0; }
        .timer { font-size: 2rem; position: absolute; top: 20px; right: 30px; font-weight: bold; }
        .instructions { font-size: 1.5rem; margin-bottom: 40px; color: #bdc3c7; }
        
        button {
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 20px 40px;
            font-size: 2rem;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:active { transform: translateY(4px); box-shadow: none; }

        .tap-zones {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            opacity: 0.3;
        }
        .tap-zones div {
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>Pharma Charades</h1>
        <p class="instructions">Hold iPad upright on your forehead.<br>Tilt DOWN &gt; 30° = Correct<br>Tilt UP &gt; 30° = Pass<br>Return to upright to show next word.</p>
        <button onclick="requestSensorPermission()">START GAME</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="timer" id="time-left">60</div>
        <div class="word-display" id="current-word">Word</div>
        <div class="tap-zones">
            <div onclick="handleSkip()">Tap: Pass</div>
            <div onclick="handleCorrect()">Tap: Correct</div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen">
        <h1>Time's Up!</h1>
        <div class="word-display" id="final-score">Score: 0</div>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <script>
        const words = [
            "Chloramphenicol",
            "Methotrexate",
            "Hydroxyurea",
            "Febuxostat",
            "6-Mercaptopurine",
            "Probenecid"
        ];

        let shuffledWords = [];
        let currentWordIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        
        let isProcessingTilt = false; 
        let waitingForReset = false; // Requires returning to the +/- 30 deg zone to unlock the next guess

        function requestSensorPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startGame();
                        } else {
                            alert("Gyroscope permission denied. You can use the tap buttons.");
                            startGame();
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                startGame();
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.body.style.backgroundColor = '#3498db';

            score = 0;
            timeLeft = 60;
            isProcessingTilt = false;
            waitingForReset = false;
            document.getElementById('time-left').innerText = timeLeft;
            
            shuffledWords = [...words].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            showNextWord();

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function showNextWord() {
            if (currentWordIndex >= shuffledWords.length) {
                shuffledWords = [...words].sort(() => Math.random() - 0.5);
                currentWordIndex = 0;
            }
            document.getElementById('current-word').innerText = shuffledWords[currentWordIndex];
        }

        function handleOrientation(event) {
            if (timeLeft <= 0 || document.getElementById('game-screen').style.display === 'none') return;

            let tilt = event.beta; 
            let upright = 90; // 90 degrees is perfectly vertical
            let threshold = 30; // The +/- 30 degree buffer zone

            let isNormalZone = (tilt > upright - threshold) && (tilt < upright + threshold); // 60 to 120 degrees
            let isDown = tilt >= upright + threshold; // 120 degrees or more (face towards floor)
            let isUp = tilt <= upright - threshold && tilt > 0; // 60 degrees or less (face towards ceiling)

            // If the iPad returns to the upright position, reset the lock so they can guess again
            if (isNormalZone) {
                waitingForReset = false;
                if (!isProcessingTilt) {
                    document.body.style.backgroundColor = '#3498db'; // Return to blue
                }
            }

            // Do nothing if we are in the middle of a 1.2s animation OR if the player hasn't returned the iPad upright yet
            if (isProcessingTilt || waitingForReset) return;

            // Trigger guesses only if we have a clean reset
            if (isDown) {
                handleCorrect();
            } else if (isUp) {
                handleSkip();
            }
        }

        function handleCorrect() {
            if (isProcessingTilt) return;
            isProcessingTilt = true;
            waitingForReset = true; // Lock further guesses until iPad goes back to vertical
            score++;
            
            document.body.style.backgroundColor = '#2ecc71';
            document.getElementById('current-word').innerText = "CORRECT!";
            
            setTimeout(() => {
                currentWordIndex++;
                showNextWord();
                isProcessingTilt = false;
                // Note: The screen stays green until they bring it back to vertical, which provides good visual feedback
            }, 1200);
        }

        function handleSkip() {
            if (isProcessingTilt) return;
            isProcessingTilt = true;
            waitingForReset = true; // Lock further guesses until iPad goes back to vertical
            
            document.body.style.backgroundColor = '#e74c3c';
            document.getElementById('current-word').innerText = "PASS";
            
            setTimeout(() => {
                currentWordIndex++;
                showNextWord();
                isProcessingTilt = false;
            }, 1200);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex';
            document.body.style.backgroundColor = '#2c3e50';
            document.getElementById('final-score').innerText = `Score: ${score}`;
            window.removeEventListener('deviceorientation', handleOrientation);
        }

        function resetGame() {
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
